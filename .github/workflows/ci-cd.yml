name: CI and deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Backend tests
        working-directory: backend
        run: python -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
          node --test tests/localization.test.mjs
      - name: Build container images
        run: |
          docker build -t cctv-backend:ci backend
          docker run --rm --entrypoint test cctv-backend:ci -r /app/app/schema.sql
          docker build -t cctv-frontend:ci frontend

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cctv-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check that this is still the latest main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists; skipping this deployment."
            echo "deploy=false" >> "$GITHUB_ENV"
          else
            echo "deploy=true" >> "$GITHUB_ENV"
          fi
      - name: Configure SSH
        if: env.deploy == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy tested commit
        if: env.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -o pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          release="/opt/cctv-recognition/releases/$GITHUB_SHA"
          git archive "$GITHUB_SHA" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$release' && tar -xf - -C '$release'"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$release' && BACKEND_ENV_FILE=/opt/cctv-recognition/backend.env docker compose -p cctv-recognition -f compose.yaml -f compose.server.yaml up -d --build --wait && curl -fsS http://127.0.0.1:8080/api/health/database"
