services:
  inspection-worker:
    profiles: ["inspection"]
    build:
      context: ./backend
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    environment:
      DB_DRIVER: ODBC Driver 18 for SQL Server
      SCHEDULED_INSPECTION_ENABLED: ${SCHEDULED_INSPECTION_ENABLED:-false}
      SCHEDULED_INSPECTION_SNAPSHOT_DIR: /snapshots
    volumes:
      - ./camera-snapshots:/snapshots
    command: ["python", "-m", "app.scheduled_inspection"]
    restart: "no"

  backend:
    build:
      context: ./backend
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    environment:
      DB_DRIVER: ODBC Driver 18 for SQL Server
      SCHEDULED_INSPECTION_SNAPSHOT_DIR: /snapshots
    volumes:
      - ./camera-snapshots:/snapshots
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
